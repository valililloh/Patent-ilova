<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F1420">
<title>Patent imtihoni</title>
<style>
  :root{
    --bg:#0F1420; --card:#18202E; --card2:#1E2838; --line:#2B3648; --accent:#3B82F6;
    --text:#EDF1F7; --muted:#8593A8; --ok:#25B36B; --okbg:#123526;
    --bad:#E0524A; --badbg:#3A1A18; --amber:#E8A33D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);min-height:100%;}
  body{color:var(--text);min-height:100vh;
    padding:max(34px, calc(env(safe-area-inset-top,0px) + 8px)) 16px calc(env(safe-area-inset-bottom,0px) + 40px);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;}
  .wrap{max-width:500px;margin:0 auto;}
  button{font-family:inherit;cursor:pointer;}
  img{-webkit-user-drag:none;user-select:none;}

  /* Til tanlash */
  .langscreen{padding-top:36px;text-align:center;}
  .logo{font-size:52px;margin-bottom:6px;}
  .bigtitle{font-size:25px;font-weight:800;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:30px;line-height:1.5;}
  .langbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:18px;
    font-weight:700;padding:17px;margin-bottom:11px;text-align:left;}
  .flag{font-size:25px;}
  .phrow{display:flex;gap:8px;margin-bottom:8px;}
  .phcode{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);
    font-size:16px;font-weight:700;padding:14px 8px;}
  .phinput{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-size:18px;padding:14px;letter-spacing:1px;}
  .phinput:focus,.phcode:focus{outline:none;border-color:var(--accent);}
  .pherr{color:var(--bad);font-size:13px;min-height:16px;margin-bottom:8px;text-align:left;}

  /* Bosh sahifa */
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .title{margin:0;font-size:23px;font-weight:800;}
  .small{background:transparent;color:var(--accent);border:1px solid var(--line);
    border-radius:10px;font-size:13px;font-weight:700;padding:8px 11px;}
  .updbar{font-size:12px;color:var(--muted);margin-bottom:16px;min-height:16px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;}
  .langchip,.idchip{background:var(--card);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-size:13px;font-weight:700;padding:8px 11px;white-space:nowrap;max-width:60%;
    overflow:hidden;text-overflow:ellipsis;}
  .idchip{color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.5px;}
  .idchip.copied{color:var(--ok);border-color:var(--ok);}
  .varbtn.lock{opacity:.45;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0;}
  .varbtn.lock .vn{font-size:15px;} .varbtn.lock .vl{font-size:11px;}
  .topic{display:flex;justify-content:space-between;align-items:center;width:100%;
    background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);
    padding:17px;margin-bottom:10px;text-align:left;}
  .topic.main{background:var(--accent);border-color:var(--accent);color:#fff;}
  .topic.mist{background:var(--card2);}
  .tname{font-size:17px;font-weight:700;}
  .tcount{font-size:13px;opacity:.75;}
  .sect{font-size:12px;color:var(--muted);font-weight:700;margin:16px 0 10px;letter-spacing:.6px;text-transform:uppercase;}
  .vargrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px;}
  .varbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);
    font-size:17px;font-weight:700;padding:16px 0;text-align:center;transition:background .12s;}
  .varbtn:active{background:var(--accent);color:#fff;}
  @keyframes popin{from{opacity:0;transform:translateY(14px) scale(.9);}to{opacity:1;transform:none;}}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .vanim .varbtn{animation:popin .34s cubic-bezier(.2,.85,.25,1) both;}
  .vtitle{animation:fadein .3s ease both;}

  /* Savol */
  .qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .qnum{font-size:13px;color:var(--muted);font-weight:600;}
  .bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  .qcard{background:#1C2740;border:1px solid #2E3C57;border-left:4px solid var(--accent);
    border-radius:14px;padding:17px;margin-bottom:14px;}
  .matn{font-size:15px;line-height:1.5;color:#CDD6E4;white-space:pre-line;
    background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px;}
  .matn .mtr{color:var(--muted);font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .qru{font-size:19px;font-weight:700;line-height:1.35;}
  .qtr{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
    font-size:14.5px;color:var(--muted);line-height:1.4;}
  .qtr-wrap{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .qtr-tg{background:transparent;border:none;color:var(--accent);font-size:14px;font-weight:700;
    padding:2px 0;display:flex;align-items:center;gap:7px;}
  .qtr-tg .chev{transition:transform .22s;display:inline-block;font-size:12px;}
  .qtr-tg.open .chev{transform:rotate(180deg);}
  .qtr-body{margin-top:9px;font-size:14.5px;color:var(--muted);line-height:1.45;animation:fadein .2s ease;}
  /* Tutorial */
  .tut-overlay{position:fixed;inset:0;background:rgba(6,10,18,.80);z-index:1000;animation:fadein .25s ease;}
  .tut-hl{box-shadow:0 0 0 3px var(--accent),0 10px 34px rgba(0,0,0,.55);border-radius:14px;}
  .tut-tip{position:fixed;left:16px;right:16px;max-width:468px;margin:0 auto;background:var(--card2);
    border:1px solid var(--line);border-radius:16px;padding:16px;z-index:1003;
    animation:popin .34s cubic-bezier(.2,.85,.25,1) both;box-shadow:0 12px 44px rgba(0,0,0,.55);}
  .tut-x{position:absolute;top:6px;right:8px;background:transparent;border:none;color:var(--muted);
    font-size:26px;line-height:1;padding:4px 9px;}
  .tut-title{font-size:18px;font-weight:800;margin-bottom:6px;padding-right:30px;}
  .tut-desc{font-size:14.5px;color:#C6D0DF;line-height:1.5;}
  .tut-foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;}
  .tut-dots{font-size:13px;color:var(--muted);font-weight:700;}
  .tut-next{background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;padding:10px 17px;}
  .help{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;
    font-size:15px;font-weight:700;padding:8px 12px;margin-right:8px;}
  .dlbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card2);
    border:1px solid var(--amber);border-radius:14px;color:var(--text);padding:15px;margin-top:14px;text-align:left;}
  .dlbtn .dlname{font-size:15px;font-weight:700;}
  .dlbtn .dlstat{font-size:13px;color:var(--amber);font-weight:700;white-space:nowrap;margin-left:10px;}
  .dlprog{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-top:9px;}
  .dlprog i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s;}
  .opt{display:block;width:100%;background:var(--card);border:2px solid var(--line);
    border-radius:14px;color:var(--text);font-size:17px;font-weight:600;padding:15px;
    margin-bottom:9px;text-align:left;transition:background .15s,border-color .15s;}
  .opt.ok{background:var(--okbg);border-color:var(--ok);}
  .opt.bad{background:var(--badbg);border-color:var(--bad);}
  .opt:disabled{opacity:1;}

  /* Rasmli variantlar */
  .imgopts{display:flex;gap:10px;flex-wrap:wrap;}
  .imgopt{flex:1;min-width:90px;background:var(--card);border:3px solid var(--line);
    border-radius:14px;padding:10px;transition:border-color .15s;}
  .imgopt img{width:100%;height:auto;border-radius:6px;display:block;background:#fff;}
  .imgopt.ok{border-color:var(--ok);}
  .imgopt.bad{border-color:var(--bad);}

  /* Ovoz */
  .playbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:var(--amber);color:#231a06;border:none;border-radius:14px;font-size:17px;
    font-weight:800;padding:15px;margin-bottom:13px;min-height:54px;}
  .playbtn.playing{background:#c98a2a;}
  .playbtn:disabled{opacity:.6;}
  .playnote{font-size:12.5px;color:var(--muted);text-align:center;margin:-6px 0 12px;}

  /* Yozma */
  .yinput{width:100%;background:var(--card2);border:2px solid var(--line);border-radius:12px;
    color:var(--text);font-size:18px;padding:14px;margin-bottom:11px;}
  .yinput:focus{outline:none;border-color:var(--accent);}
  .yinput.ok{border-color:var(--ok);background:var(--okbg);}
  .yinput.bad{border-color:var(--bad);background:var(--badbg);}

  .explain{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:4px 0 13px;}
  .exhead{font-weight:800;color:var(--bad);margin-bottom:7px;}
  .exok{font-size:14.5px;margin-bottom:9px;}
  .exok b{color:var(--ok);}
  .extext{font-size:14.5px;line-height:1.45;}
  .primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;
    font-size:17px;font-weight:800;padding:15px;min-height:54px;}
  .ghost{width:100%;background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:14px;font-size:15px;font-weight:700;padding:13px;margin-top:10px;}

  /* Natija */
  .done{text-align:center;padding-top:34px;}
  .donenum{font-size:52px;font-weight:800;color:var(--accent);margin:8px 0;}
  .empty{text-align:center;color:var(--muted);padding:36px 0;font-size:15px;}
  /* Demo imtihon */
  .topic.demo{background:var(--card2);border-color:var(--amber);}
  .examtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .timer{font-size:16px;font-weight:800;color:var(--amber);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:7px 13px;}
  .timer.low{color:var(--bad);border-color:var(--bad);}
  .opt.sel{background:#1c2c46;border-color:var(--accent);}
  .imgopt.sel{border-color:var(--accent);}
  .rescard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-bottom:14px;}
  .respct{font-size:54px;font-weight:800;margin:6px 0;}
  .respass{color:var(--ok);} .resfail{color:var(--bad);}
  .resmsg{font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .resfact{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;
    font-size:13.5px;color:#C6D0DF;line-height:1.5;margin-bottom:14px;}
  .revitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;}
  .revq{font-size:15px;font-weight:700;margin-bottom:9px;line-height:1.35;}
  .revline{font-size:14px;margin:3px 0;line-height:1.4;}
  .revline.bad{color:var(--bad);} .revline.ok{color:var(--ok);}
  .reviz{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.45;padding-top:8px;border-top:1px solid var(--line);}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);
    background:rgba(30,40,56,.97);color:var(--text);border:1px solid var(--line);border-radius:12px;
    padding:11px 18px;font-size:14px;font-weight:600;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.5);
    max-width:82%;text-align:center;animation:fadein .2s ease;}
</style>
</head>

    sendIdOnce();
    var gs=audioGroups(),i=0,total=gs.length,bar=prog?prog.querySelector("i"):null;
    if(prog)prog.style.display="block";
    function upd(){if(stat)stat.textContent=i+"/"+total;if(bar)bar.style.width=(total?i/total*100:0)+"%";}
    function step(){
      if(i>=total){if(stat)stat.textContent=t().dlDone;if(prog)setTimeout(function(){prog.style.display="none";},700);return;}
      var g=gs[i];
      idbGet(g,function(b){
        if(b){i++;upd();step();return;}
        fetch(BASE+g+".mp3").then(function(r){if(!r.ok)throw 0;return r.blob();})
          .then(function(bl){idbPut(g,bl);i++;upd();step();})
          .catch(function(){i++;upd();step();});
      });
    }
    upd();step();
  }

      fetch(BASE+guruh+".mp3").then(function(r){if(!r.ok)throw 0;return r.blob();})
        .then(function(b){idbPut(guruh,b);cb(URL.createObjectURL(b));})
        .catch(function(){cb(null);});
    });
  }

  /* ====== Demo imtihon ====== */
  var EXAM_N=22, EXAM_SECONDS=40*60, EXAM_PASS=19;
  function examPool(){return POOL.filter(function(q){return q.tur!=="yozma";});}
  // Imtihon UNIT (birlik) darajasida quriladi — ovoz juftlari ajralmaydi
  function buildExamUnits(){
    var pool=examPool();
    var tilUnits=shuffle(unitize(pool.filter(function(q){return q.mavzu==="til";})));  // juftlar birga
    var tarix=shuffle(pool.filter(function(q){return q.mavzu==="tarix";}));
    var qon=shuffle(pool.filter(function(q){return q.mavzu==="qonunchilik";}));
    var units=[],tilTasks=0,singles=[];
    // til: 10 ta vazifaga yetguncha (juft=2, bitta=1)
    for(var i=0;i<tilUnits.length && tilTasks<10;i++){
      var u=tilUnits[i],sz=unitSize(u);
      if(tilTasks+sz<=10){units.push(u);tilTasks+=sz;}
      else if(sz===1){units.push(u);tilTasks+=1;}
      else singles.push(u); // juft sig'madi — keyin bittalar bilan to'ldiramiz
    }
    // agar toq qolgan bo'lsa, til bitta savollari bilan 10 ga to'ldiramiz
    if(tilTasks<10){
      var tilSingles=shuffle(pool.filter(function(q){return q.mavzu==="til" && q.tur!=="ovoz";}));
      for(var j=0;j<tilSingles.length && tilTasks<10;j++){
        if(units.indexOf(tilSingles[j])<0){units.push(tilSingles[j]);tilTasks++;}
      }
    }
    tarix.slice(0,5).forEach(function(q){units.push(q);});
    qon.slice(0,7).forEach(function(q){units.push(q);});
    return shuffle(units);
  }

  function positionTip(tip,target){
    var h=tip.offsetHeight||150,top;
    if(target){var r=target.getBoundingClientRect();
      if(r.bottom+h+16<window.innerHeight)top=r.bottom+12;
      else if(r.top-h-12>8)top=r.top-h-12;
      else top=Math.max(12,(window.innerHeight-h)/2);
    }else top=(window.innerHeight-h)/2;
    tip.style.top=Math.round(top)+"px";
  }
  function showTutStep(){

    var ov=document.createElement("div");ov.className="tut-overlay";ov.id="tutov";document.body.appendChild(ov);
    if(target){target.classList.add("tut-hl");target.style.position="relative";target.style.zIndex="1002";

    window.scrollTo(0,0);
  }

  function renderPair(unit,head,isExam){
    var L=t();
    var body=head+'<button class="playbtn" id="play">'+esc(L.listen)+'</button><div class="playnote" id="pnote"></div>';
    unit.pair.forEach(function(q,bi){
      var order=shuffle(q.javoblar.map(function(_,i){return i;}));q._order=order;
      body+='<div class="qcard"><div class="qru"><span style="color:var(--muted);font-weight:800">'+(bi+1)+'.</span> '+esc(q.savol)+'</div></div>'+
        order.map(function(oi){return '<button class="opt" data-b="'+bi+'" data-o="'+oi+'">'+esc(q.javoblar[oi])+'</button>';}).join("")+
        '<div id="after'+bi+'"></div>';
    });
    body+='<div id="pairnext"></div>';
    app.innerHTML=body;
    var bk=document.getElementById("back");if(bk)bk.onclick=function(){stopAudio();state.view=backView();render();};
    setupPlay({ovoz_guruh:unit.ovoz_guruh});
    var answered=[false,false],chosen=[null,null];
    // Mashq rejimi: ikkala savol javob berilgach natijani ko'rsatamiz
    function reveal(){
      unit.pair.forEach(function(q,bi){
        var oi=chosen[bi];
        var selBtn=app.querySelector('.opt[data-b="'+bi+'"][data-o="'+oi+'"]');
        if(selBtn)selBtn.classList.remove("sel");
        if(oi===q.togri){if(selBtn)selBtn.classList.add("ok");state.correct++;removeMistake(qid(q));}
        else{
          if(selBtn)selBtn.classList.add("bad");
          var okb=app.querySelector('.opt[data-b="'+bi+'"][data-o="'+q.togri+'"]');if(okb)okb.classList.add("ok");
          addMistake(qid(q));markWrong(q);requeue(q);
          document.getElementById("after"+bi).innerHTML='<div class="explain"><div class="exhead">✕ '+esc(L.wrong)+'</div>'+
            '<div class="exok">'+esc(L.right)+' <b>'+esc(q.javoblar[q.togri])+'</b></div>'+
            (iz(q)?'<div class="extext">💡 '+esc(iz(q))+'</div>':'')+'</div>';
        }
      });
      document.getElementById("pairnext").innerHTML='<button class="primary" id="nextbtn">'+esc(L.next)+' →</button>';
      document.getElementById("nextbtn").onclick=next;
    }
    function checkDone(){
      if(!(answered[0]&&answered[1]))return;
      if(isExam){stopAudio();setTimeout(examNext,700);}
      else{reveal();}
    }
    unit.pair.forEach(function(q,bi){
      app.querySelectorAll('.opt[data-b="'+bi+'"]').forEach(function(btn){
        btn.onclick=function(){
          if(answered[bi])return;answered[bi]=true;
          var oi=+btn.getAttribute("data-o");chosen[bi]=oi;
          app.querySelectorAll('.opt[data-b="'+bi+'"]').forEach(function(b){b.disabled=true;});
          btn.classList.add("sel"); // neytral belgi — to'g'ri/xato hali ko'rsatilmaydi
          if(isExam)state.examAns[qid(q)]=oi;
          checkDone();
        };
      });
    });
    window.scrollTo(0,0);
  }

  function setupPlay(q){
    var L=t(),btn=document.getElementById("play"),note=document.getElementById("pnote");
    btn.onclick=function(){
      stopAudio();
      note.textContent=L.audioLoad;btn.disabled=true;
      getAudioURL(q.ovoz_guruh,function(url){
        btn.disabled=false;
        if(!url){note.textContent=L.audioOff;return;}
        note.textContent="";
        _audio=new Audio(url);
        _audio.onplay=function(){btn.classList.add("playing");btn.textContent=L.playing;};
        _audio.onended=_audio.onpause=function(){btn.classList.remove("playing");btn.textContent=L.listen;};
        _audio.onerror=function(){note.textContent=L.audioOff;};
        _audio.play().catch(function(){note.textContent=L.audioOff;});
      });
    };
  }
  function stopAudio(){if(_audio){try{_audio.pause();}catch(e){}_audio=null;}}

  function markResult(q,correct){
    if(correct){state.correct++;removeMistake(qid(q));}
    else addMistake(qid(q));
  }
  function markWrong(q){if(state.everWrong)state.everWrong[qid(q)]=1;}
  // Xato savolni 2 ta savoldan keyin qayta ko'rsatish (o'rganishni osonlashtiradi)
  function requeue(q){if(!state.requeueOn)return;var pos=Math.min(state.idx+3,state.list.length);state.list.splice(pos,0,q);}

  function answerText(q,oi,btn){
    if(state.answered)return;state.answered=true;stopAudio();
    var L=t();
    if(oi===q.togri){
      btn.classList.add("ok");markResult(q,true);setTimeout(next,1000);
    }else{
      btn.classList.add("bad");
      var okb=app.querySelector('.opt[data-o="'+q.togri+'"]');if(okb)okb.classList.add("ok");
      markResult(q,false);markWrong(q);requeue(q);showExplain(q,q.javoblar[q.togri]);
    }
  }
  function answerImg(q,name,btn){
    if(state.answered)return;state.answered=true;
    var L=t();
    if(name===q.togri_rasm){
      btn.classList.add("ok");markResult(q,true);setTimeout(next,1000);
    }else{
      btn.classList.add("bad");
      var okb=app.querySelector('.imgopt[data-img="'+name.replace(/"/g,'')+'"]');
      // to'g'ri rasmни belgilash
      app.querySelectorAll(".imgopt").forEach(function(b){if(b.getAttribute("data-img")===q.togri_rasm)b.classList.add("ok");});
      markResult(q,false);markWrong(q);requeue(q);showExplain(q,null);
    }
  }
  function renderYozma(q,head){
    var L=t();
    app.innerHTML=head+'<div class="qcard"><div class="qru">'+esc(q.savol)+'</div>'+trBlockHTML(q)+'</div>'+
      '<input class="yinput" id="yin" placeholder="'+esc(L.typeHere)+'" autocomplete="off">'+
      '<button class="primary" id="ycheck">'+esc(L.check)+'</button><div id="after"></div>';
    wireTr();
    document.getElementById("back").onclick=function(){state.view=backView();render();};
    var inp=document.getElementById("yin");
    function norm(s){return String(s||"").trim().toLowerCase().replace(/[.,!?ё]/g,function(c){return c==="ё"?"е":"";}).replace(/\s+/g," ");}
    document.getElementById("ycheck").onclick=function(){
      if(state.answered)return;
      var val=norm(inp.value),ans=norm(q.javob);
      if(!val)return;
      state.answered=true;inp.disabled=true;
      var ok=(val===ans)||(ans.indexOf(val)>=0&&val.length>=3)||(val.indexOf(ans)>=0);
      if(ok){inp.classList.add("ok");markResult(q,true);setTimeout(next,1200);}
      else{inp.classList.add("bad");markResult(q,false);markWrong(q);requeue(q);showExplain(q,q.javob);}
    };
    inp.focus();
  }

  function showExplain(q,rightText){
    var L=t();
    var h='<div class="explain"><div class="exhead">✕ '+esc(L.wrong)+'</div>'+
      (rightText?'<div class="exok">'+esc(L.right)+' <b>'+esc(rightText)+'</b></div>':'')+
      (iz(q)?'<div class="extext">💡 '+esc(iz(q))+'</div>':'')+'</div>'+
      '<button class="primary" id="nextbtn">'+esc(L.next)+' →</button>';
    document.getElementById("after").innerHTML=h;
    document.getElementById("nextbtn").onclick=next;
  }

  function next(){
    if(state.view!=="quiz")return;stopAudio();
    state.idx++;
    if(state.idx>=state.list.length){
      if(/^V\d+$/.test(state.topic)){
        if(!VARIANTS.length)buildVariants();
        var vi=parseInt(state.topic.slice(1),10)-1,mo=get("pi_varmax",1);
        if(vi+1<VARIANTS.length && vi+1>=mo)set("pi_varmax",Math.min(vi+2,VARIANTS.length));
      }
      state.view="done";
    }
    render();window.scrollTo(0,0);
  }

  function renderDone(){
    var L=t();
    var uniq=state.uniqueTotal||totalTasks(state.list);
    var wrongN=state.everWrong?Object.keys(state.everWrong).length:0;
    var first=Math.max(0,uniq-wrongN);
    app.innerHTML='<div class="done"><div class="logo">🎉</div><h1 class="bigtitle">'+esc(L.done)+'</h1>'+
      '<div class="sub">'+esc(L.score)+'</div><div class="donenum">'+first+' / '+uniq+'</div>'+
      '<button class="primary" id="again">'+esc(L.again)+'</button>'+
      '<button class="ghost" id="home">'+esc(L.home)+'</button></div>';
    document.getElementById("again").onclick=function(){
      if(/^V\d+$/.test(state.topic))startVariant(parseInt(state.topic.slice(1),10)-1);
      else startQuiz(state.topic);
    };
    document.getElementById("home").onclick=function(){state.view="home";render();};
  }

  function addMistake(id){if(state.mistakes.indexOf(id)<0){state.mistakes.push(id);set("pi_mistakes",state.mistakes);}}
  function removeMistake(id){var i=state.mistakes.indexOf(id);if(i>=0){state.mistakes.splice(i,1);set("pi_mistakes",state.mistakes);}}

  render();
  checkVersion();
  if(state.view==="home"){checkUpdate();sendIdOnce();}
  window.addEventListener("online",function(){sendIdOnce();checkVersion();});

  /* ====== Toast ====== */
  var _toastT=null;
  function showToast(msg){
    var e=document.getElementById("pi_toast");
    if(!e){e=document.createElement("div");e.id="pi_toast";e.className="toast";document.body.appendChild(e);}
    e.textContent=msg;e.style.display="block";
    clearTimeout(_toastT);_toastT=setTimeout(function(){if(e)e.style.display="none";},1800);
  }

  /* ====== Android "orqaga" tugmasi — ilova ichida qaytadi, chiqib ketmaydi ====== */
  var _exitArmed=false,_exitT=null;
  function seedBack(){try{history.pushState({pi:1},"");}catch(e){}}
  seedBack();
  window.addEventListener("popstate",function(){
    if(blocked){seedBack();return;}                 // yangilash ekrani — qulf
    var v=state.view;
    if(v==="home"||v==="lang"){                      // bosh sahifa — ikki marta bossa chiqadi
      if(_exitArmed){history.back();return;}
      _exitArmed=true;
      var L=T[state.lang]||T.uz;showToast(L.exitHint);
      seedBack();clearTimeout(_exitT);_exitT=setTimeout(function(){_exitArmed=false;},2000);
      return;
    }
    stopAudio();
    if(typeof clearExamTimer==="function")clearExamTimer();
    if(v==="quiz")state.view=backView();
    else if(v==="examreview")state.view="examresult";
    else state.view="home";
    render();seedBack();
  });
})();
</script>
</body>
</html>
